# Pictures of the game's windows, and a short scripted game, on Windows, Linux and macOS, on x64 and
# ARM, every push and pull request.
#
# There is no copy of Mordor here, and none may be put here (ci.yml), so the windows are drawn from the
# port's own test fixture: a small invented game whose data files the port writes (FixtureGame), with
# placeholder pictures and help in place of Mordor's (GameArt). Two passes run on it:
#   - the UI checks' readability pass opens every window it knows - the main menu, Options, Help, About,
#     the town with each character tab and service, the dungeon, the menu's boxes - in the Light and
#     the Dark theme, fails the job on text too faint to read, and saves each window as drawn;
#   - the playthrough plays a short game through the real windows: two characters made, one joins a
#     second guild, both buy and equip gear, form a party, go down, win a fight, level up in town, one
#     learns a spell, buffers it as their Combat Setting and casts it in a second fight. Each step is
#     checked and pictured (playthrough/). Its outcomes are made certain by the fixture's data, not by
#     fixing the dice: the game's own rules run as they do for a player.
# The readability pass also fails on a character no font on the machine can draw, text clipped by its
# control, and a control past its window's edge (LayoutCheck), and writes checks.json. Each machine
# then compares its pictures with its own from the last main run (--compare): the run's summary page
# says what changed. The pictures are the run's artifacts, one set per machine: the same windows,
# drawn by each system's fonts and text engine. A last job puts all five on one page (--gallery). The ARM machines are there for the native ARM64 builds (Windows, Linux, and
# macOS on Apple Silicon, which is the only Mac GitHub offers).
name: Screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # to fetch the last main run's pictures, each machine's baseline
  actions: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pictures:
    # the public repository's runners are free; the private one's count against its minutes
    if: github.repository == 'uncanardnoir/open-dejenol'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      # the runner has other SDKs too; build with the .NET 10 one just installed, as the project does
      - name: Pin the .NET 10 SDK
        shell: bash
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --force

      - name: Build the window checks
        shell: bash
        run: dotnet build tests/Mordor.UiCheck -c Release

      - name: Make the test fixture (an invented game, no Mordor files)
        id: fixture
        shell: bash
        run: dotnet run --project tests/Mordor.UiCheck -c Release --no-build -- --make-fixture "$RUNNER_TEMP/fixture"

      - name: Draw every window, Light and Dark, and check its text can be read
        shell: bash
        env:
          MORDOR_SNAPSHOT_DIR: ${{ runner.temp }}/screenshots
        run: dotnet run --project tests/Mordor.UiCheck -c Release --no-build -- "$RUNNER_TEMP/fixture" --contrast-only

      # run whatever the readability pass said, so a faint label does not hide a broken game
      - name: Play a short game through the windows
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        env:
          MORDOR_SNAPSHOT_DIR: ${{ runner.temp }}/screenshots
        run: dotnet run --project tests/Mordor.UiCheck -c Release --no-build -- "$RUNNER_TEMP/fixture" --playthrough

      # The baseline: this machine's pictures from the last finished run on main (this run, on a push
      # to main, is still going and so is not it). A pull request is compared with main. None found -
      # the first run, or a machine new to the matrix - is reported as such, not as a failure.
      - name: Fetch this machine's pictures from the last main run
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow screenshots.yml --branch main --event push --status completed --limit 1 --json databaseId -q ".[0].databaseId")
          if [ -z "$id" ]; then echo "no finished run on main yet"; exit 0; fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n "screenshots-$RUNNER_OS-$RUNNER_ARCH" -D "$RUNNER_TEMP/baseline" \
            || echo "run $id has no pictures for this machine"

      # what changed since then: before, after and a difference picture for each, and a line on the
      # run's summary page; it never fails the job, it only reports
      - name: Compare with the last main run
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          dotnet run --project tests/Mordor.UiCheck -c Release --no-build -- --compare "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/screenshots/compare"
          { echo "### $RUNNER_OS $RUNNER_ARCH"; cat "$RUNNER_TEMP/screenshots/compare/summary.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

  # One page for every machine: a row per screen, a column per machine, changed and failing pictures
  # marked (Mordor.UiCheck --gallery). Download "gallery" from the run and open index.html.
  gallery:
    if: ${{ always() && github.repository == 'uncanardnoir/open-dejenol' }}
    needs: pictures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pin the .NET 10 SDK
        shell: bash
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --force

      - name: Build the window checks
        shell: bash
        run: dotnet build tests/Mordor.UiCheck -c Release

      # each machine's artifact into a folder of its own name (screenshots-<os>-<arch>)
      - uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          path: ${{ runner.temp }}/artifacts

      - name: Build the gallery
        shell: bash
        run: |
          dotnet run --project tests/Mordor.UiCheck -c Release --no-build -- --gallery "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/gallery"
          echo "Every machine on one page: download **gallery** below and open \`index.html\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the gallery
        uses: actions/upload-artifact@v7
        with:
          name: gallery
          path: ${{ runner.temp }}/gallery
